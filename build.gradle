plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = '2.0.0'
group = 'fr.shoqapik'

base {
    archivesName = 'noelytramod-1.21.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', 'noelytrasmod'
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', 'noelytrasmod'
        programArgument '--nogui'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.172"
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'noelytrasmod',
            'Specification-Vendor'  : 'shoqapik',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : 'shoqapik',
            'MixinConfigs'          : 'noelytramod.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
