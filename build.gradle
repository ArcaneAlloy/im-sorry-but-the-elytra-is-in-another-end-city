plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '2.0.0'
group = 'fr.shoqapik'

base {
    archivesName = 'noelytramod-NeoForge-26.1.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = '26.1.2.22-beta'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        noelytrasmod {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
